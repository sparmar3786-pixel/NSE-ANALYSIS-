name: Build NSE Analyzer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Verify NSE Analyzer source
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/option-chain-analyzer.html
          test -f app/src/main/AndroidManifest.xml
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/sachin/nseanalyzer/MainActivity.kt
          test -s app/build.gradle.kts
          echo "Required Android source files are present."

      - name: Unit tests
        run: gradle test --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK created: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Analyzer-V10-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
