name: Build NSE Analyzer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify NSE Analyzer source
        run: |
          test -s app/src/main/assets/option-chain-analyzer.html
          grep -q 'NSE / SENSEX Option Flow' app/src/main/assets/option-chain-analyzer.html
          grep -q 'WaveTrend' app/src/main/assets/option-chain-analyzer.html
          grep -q 'com.sachin.nseanalyzer' app/src/main/AndroidManifest.xml

      - name: Unit tests
        run: gradle test --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Analyzer-V10-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
